name: Validate Financy
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: financy
          POSTGRES_USER: financy
          POSTGRES_PASSWORD: financy_local
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U financy -d financy"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      TEST_DATABASE_URL: postgresql://financy:financy_local@127.0.0.1:5433/financy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:docker
